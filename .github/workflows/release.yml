name: Build and Release Windows Package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release version tag (e.g. v1.2.0)"
        required: true
        default: "v1.2.0"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Portable Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated test suite
        run: |
          pytest -v

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.version_tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          $ver = $tag.TrimStart('v', 'V')
          Set-Content -Path "VERSION" -Value $ver -Encoding UTF8 -NoNewline
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build and package Windows x64 release
        run: |
          call scripts\release.bat

      - name: Verify release package integrity and zero secrets
        shell: pwsh
        run: |
          $zipPath = "dist/Chande-v${{ steps.version.outputs.version }}-Windows-x64.zip"
          $shaPath = "$zipPath.sha256"
          if (-not (Test-Path $zipPath)) { throw "Missing release archive: $zipPath" }
          if (-not (Test-Path $shaPath)) { throw "Missing SHA-256 file: $shaPath" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath))
          try {
            $entries = $archive.Entries | ForEach-Object { $_.FullName }
            if (-not ($entries -contains "Chande.exe" -or $entries -contains "Chande/Chande.exe")) {
              throw "Chande.exe not found inside release archive!"
            }
            foreach ($forbidden in @("user_config.json", "market_cache.json", "request_budget.json", ".env")) {
              if ($entries | Where-Object { $_ -like "*$forbidden" -and $_ -notlike "*.env.example" }) {
                throw "Forbidden personal file found in archive: $forbidden"
              }
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Chande-v${{ steps.version.outputs.version }}-Windows-x64
          path: |
            dist/Chande-v${{ steps.version.outputs.version }}-Windows-x64.zip
            dist/Chande-v${{ steps.version.outputs.version }}-Windows-x64.zip.sha256
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Chande ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: |
            dist/Chande-v${{ steps.version.outputs.version }}-Windows-x64.zip
            dist/Chande-v${{ steps.version.outputs.version }}-Windows-x64.zip.sha256
            dist/SHA256SUMS.txt
